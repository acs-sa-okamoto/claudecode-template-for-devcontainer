# template.conf — このスキル一式の「出どころ」を決める、ただ1つの設定
#
# 個人名・組織名をスキル本文に書かないために、テンプレートリポジトリの場所はここにだけ書く。
# 社内などへ展開するときは、展開先のテンプレートでこの値を書き換えればよい（スキル本文は触らない）。
#
#   TEMPLATE_REPO  テンプレートリポジトリ。gh と同じ書式 [ホスト/]オーナー/リポジトリ
#                    github.com のとき              owner/claudecode-template-for-devcontainer
#                    GitHub Enterprise Server のとき  github.example.co.jp/org/claudecode-template-for-devcontainer
#
# 使っているところ:
#   to-prd            新規リポジトリの作成元
#   skills-update     スキルの更新元（power の step1-0・power0-onboard も同じスクリプトを使う）
#   power0-onboard    ダッシュボード（.beam/dashboard/）の取得元
#
# 設定しない値（実行する人・環境ごとに違うので、決め打ちせずその場で決まる）:
#   新規リポジトリの作成先 … gh でログイン中のアカウント
#                            組織の下に作りたいときだけ、下の REPO_OWNER のコメントを外して組織名を書く
#   クローン先             … $HOME
#
# 読む順: リポジトリ直下 .claude/skills/template.conf → 無ければ、読もうとしているスキル／スクリプトと
#         同じスキル一式の template.conf（skills/ 直下）。$HOME/.claude は使わない
#         （Windows の Claude Code から WSL の bash を呼ぶと $HOME が WSL 側の別ディレクトリを指すため）。

TEMPLATE_REPO=acs-sa-okamoto/claudecode-template-for-devcontainer
# REPO_OWNER=your-org
